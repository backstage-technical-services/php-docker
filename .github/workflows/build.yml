name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-matrix:
    name: Determine version matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - id: set-matrix
        name: Determine version matrix
        run: |
          versions=($(find . -name "Dockerfile.*" | cut -d '.' -f3-))
          echo "matrix=$(jq --compact-output --null-input '$ARGS.positional' --args -- "${versions[@]}")" | tee -a $GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  build:
    name: Build image (${{ matrix.version }}, ${{ matrix.platform.platform }})
    needs: [version-matrix]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.version-matrix.outputs.matrix) }}
        platform:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.version }}
          platforms: ${{ matrix.platform.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-${{ matrix.platform.arch }}

  pr-check:
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - run: exit 0
